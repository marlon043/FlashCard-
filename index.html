<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Confere aí</h1>
    <nav>
        <a href="#">Início</a>
    </nav>
</header>

<main>

<h2>Descubra a verdade passando o mouse</h2>

<section>

<article class="cartao">
    <div class="cartao-interno">

        <div class="cartao-frente">
            <img
            src="https://image.webmotors.com.br/_fotos/anunciousados/gigante/2026/202607/20260702/hondacg_125i_cargowmimagem11133558879.jpg"
            alt="Honda CG 125i Cargo"
            class="cartao-imagem">

            <p>Esta moto é uma Honda CG 125i Cargo?</p>
        </div>

        <div class="cartao-verso">
            <img
            src="https://image.webmotors.com.br/_fotos/anunciousados/gigante/2026/202607/20260702/hondacg_125i_cargowmimagem11133558879.jpg"
            alt="Honda CG 125i Cargo"
            class="cartao-imagem">

            <p>Sim! Esta é uma Honda CG 125i Cargo, uma motocicleta conhecida por sua economia, resistência e muito utilizada para entregas e trabalho.</p>
        </div>

    </div>
</article>

</section>

</main>

<footer>
    <p>Projeto feito por Marlon</p>
</footer>

</body>
</html>
